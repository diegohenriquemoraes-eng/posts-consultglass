name: Preparar a semana

# Domingo 18h BRT (21:00 UTC) renderiza as duas pecas da semana (terca e sexta, 7h) e
# publica docs/agenda.json + imagens/<data>/ — e' isso que o app Canteiro Consult Glass le.
# Tambem roda a cada mudanca em carrosseis.json (peca nova ou corrigida) e a pedido.
# O Diego posta a mao, pelo app, com a musica fixa da conta. Nada e' publicado por API.

on:
  schedule:
    - cron: "17 21 * * 0"    # domingo 18:17 BRT (minuto quebrado: o cron do Actions coalesce no :00)
  push:
    paths:
      - "carrosseis.json"
      - "gerar_carrossel.py"
      - "preparar.py"
      - "fotos/**"
  workflow_dispatch:
    inputs:
      slug:
        description: "Refazer uma peca especifica (slug do carrosseis.json)"
        required: false
        type: string
      data:
        description: "Data AAAA-MM-DD (com --slug: a data da peca; sem: primeira da semana)"
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: preparar-consultglass
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pillow

      - name: Renderizar e publicar a agenda
        run: |
          git pull --rebase --quiet origin main
          args="--semana"
          [ -n "${{ inputs.slug }}" ] && args="--slug ${{ inputs.slug }}"
          [ -n "${{ inputs.data }}" ] && args="$args --data ${{ inputs.data }}"
          python preparar.py $args
          git add imagens docs preparados.json
          if ! git diff --cached --quiet; then
            git -c user.name=consultglass-bot -c user.email=bot@consultglass.net.br commit -m "agenda: pecas preparadas $(date -u +%F)"
            git push origin main
          fi

      - name: Avisar se falhou
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const hoje = new Date().toISOString().slice(0, 10)
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Preparar a semana do @peritomauricioboschetti falhou em " + hoje,
              body: "Run: " + context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId +
                    "\n\nCausas comuns: sequencia esgotada (escrever pecas em carrosseis.json), foto da capa faltando."
            })
